apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: mealie
  annotations:
    # ingress-shim: cert-manager auto-creates a Certificate (into mealie-tls)
    # for the tls hosts below, issued via Let's Encrypt Cloudflare DNS-01 so it
    # works even though mls.toddpillars.com only resolves on the LAN. The
    # annotation keeps the cert-manager CRD out of the apps/ Kustomization,
    # which reconciles before infrastructure/ (where cert-manager lives).
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - mls.toddpillars.com
      secretName: mealie-tls
  rules:
    - host: mls.toddpillars.com
      http:
        paths:
          - backend:
              service:
                name: mealie
                port:
                  number: 9000
            path: /
            pathType: Prefix
