apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Homelab
    theme: dark
    color: slate
    headerStyle: clean
  services.yaml: |
    - Media:
        - Audiobookshelf:
            href: https://abs.toddpillars.com
            description: Audiobooks
    - Tools:
        - N8N:
            href: https://n8n.toddpillars.com
            description: Workflow automation
        - LinkDing:
            href: https://ld.toddpillars.com
            description: Bookmarks
        - Mealie:
            href: https://mls.toddpillars.com
            description: Recipes
        - Open WebUI:
            href: https://webui.toddpillars.com
            description: LLM chat
    - Infrastructure:
        - Proxmox:
            href: https://192.168.0.68:8006
            description: Hypervisor
            ping: 192.168.0.68
        - Hermes:
            href: http://192.168.0.75:9119
            description: VM
            ping: 192.168.0.75
        - Docker Host:
            href: http://192.168.0.77
            description: Docker VM
            ping: 192.168.0.77
  bookmarks.yaml: |
    []
  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short
  kubernetes.yaml: |
    mode: default
  docker.yaml: |
    {}
