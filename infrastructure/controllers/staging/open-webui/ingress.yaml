apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: open-webui
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ais.toddpillars.com
      secretName: open-webui-tls
  rules:
    # LAN-only host (resolved by local DNS to the Traefik ingress). Not added
    # to the cloudflared tunnel.
    - host: ais.toddpillars.com
      http:
        paths:
          - backend:
              service:
                name: open-webui
                port:
                  number: 80
            path: /
            pathType: Prefix
