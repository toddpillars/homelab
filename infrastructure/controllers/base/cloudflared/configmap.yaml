apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
data:
  # IMPORTANT: This tunnel is DASHBOARD-managed. The authoritative ingress lives
  # in the Cloudflare Zero Trust dashboard under the tunnel's "Published
  # application routes" tab, and cloudflared pulls it from the edge (logs
  # "Updated to new configuration version=N"). The `ingress:` block below is
  # therefore NOT used at runtime — it is a hand-maintained mirror for
  # documentation/readability only. To actually add or change a route, edit the
  # Published application routes in the dashboard; editing this file alone has
  # NO effect on routing. Keep the two in sync if you touch either.
  config.yaml: |
    tunnel: f7897851-6b1b-48af-9490-7739f9f17863
    credentials-file: /etc/cloudflared/credentials.json

    # NOTE: mirror-only — see the comment above. Dashboard is authoritative.
    ingress:
      - hostname: toddpillars.com
        service: http://blog.blog.svc.cluster.local:80
      - hostname: www.toddpillars.com
        service: http://blog.blog.svc.cluster.local:80
      - hostname: gulfsideai.com
        service: http://gulfside-website.gulfside.svc.cluster.local:80
      - hostname: www.gulfsideai.com
        service: http://gulfside-website.gulfside.svc.cluster.local:80
      - hostname: lds.toddpillars.com
        service: http://linkding.linkding.svc.cluster.local:9090
      - hostname: abs.toddpillars.com
        service: http://audiobookshelf.audiobookshelf.svc.cluster.local:3005
      - hostname: n8n.toddpillars.com
        service: http://n8n.naten.svc.cluster.local:5678
      - hostname: ais.toddpillars.com
        service: http://open-webui.open-webui.svc.cluster.local:80
      - service: http_status:404
