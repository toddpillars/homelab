apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: open-webui-tls
  namespace: open-webui
spec:
  # cert-manager writes the issued cert/key into this secret, referenced by the
  # ingress TLS block. Issued via Let's Encrypt using Cloudflare DNS-01, so it
  # works even though ais.toddpillars.com only resolves on the LAN.
  secretName: open-webui-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - ais.toddpillars.com
