apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: garage-tls
  namespace: garage
spec:
  # cert-manager writes the issued cert/key into this secret, referenced by the
  # ingress TLS block. Issued via Let's Encrypt using Cloudflare DNS-01, so it
  # works even though s3.toddpillars.com only resolves on the LAN.
  secretName: garage-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - s3.toddpillars.com
